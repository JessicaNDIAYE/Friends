<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaperWall ✦ Your Space of Infinite Possibility</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Caveat:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════
       AUTH SCREEN
  ═══════════════════════════════════════════ -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">

      <div class="auth-brand">
        <div class="auth-logo-wrap">
          <div class="auth-logo-dot"></div>
          <h1 class="auth-logo">PaperWall</h1>
        </div>
        <p class="auth-subtitle">SPACE OF INFINITE POSSIBILITY ✦</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">sign in</button>
        <button class="auth-tab" data-tab="signup">sign up</button>
      </div>

      <form id="login-form" class="auth-form active">
        <div class="field">
          <label>email</label>
          <input type="email" id="login-email" placeholder="hello@example.com" required />
        </div>
        <div class="field">
          <label>password</label>
          <input type="password" id="login-password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-pill">OPEN MY JOURNAL →</button>
        <p id="login-error" class="form-error"></p>
      </form>

      <form id="signup-form" class="auth-form">
        <div class="field">
          <label>username</label>
          <input type="text" id="signup-username" placeholder="how should we call you?" required />
        </div>
        <div class="field">
          <label>email</label>
          <input type="email" id="signup-email" placeholder="hello@example.com" required />
        </div>
        <div class="field">
          <label>password</label>
          <input type="password" id="signup-password" placeholder="••••••••" required minlength="6" />
        </div>
        <button type="submit" class="btn-pill">START MY JOURNAL →</button>
        <p id="signup-error" class="form-error"></p>
        <p id="signup-success" class="form-success"></p>
      </form>

    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       MAIN APP
  ═══════════════════════════════════════════ -->
  <div id="app" class="app hidden">

    <!-- ── Top header ── -->
    <header class="app-header">
      <div class="header-date-block">
        <span id="header-day" class="header-day"></span>
        <span id="header-date" class="header-date"></span>
      </div>
      <div class="header-center">
        <span class="header-logo">PaperWall</span>
      </div>
      <div class="header-right">
        <span id="topbar-username" class="header-username"></span>
        <button id="logout-btn" class="btn-icon-logout" title="sign out">✕</button>
      </div>
    </header>

    <!-- ── Right-side month tabs ── -->
    <aside class="side-tabs" id="side-tabs"></aside>

    <!-- ── Main scrollable content ── -->
    <main class="main-content">

      <!-- Feed section -->
      <section id="feed-section" class="posts-section active">
        <p class="section-tagline">what everyone's feeling</p>
        <div id="feed-posts" class="masonry-grid">
          <div class="loading-card">loading pages...</div>
        </div>
      </section>

      <!-- Journal section -->
      <section id="journal-section" class="posts-section">
        <div class="journal-topbar">
          <p class="section-tagline">my private pages</p>
          <div class="journal-quick-nav">
            <button class="qnav-btn" id="qnav-today">today</button>
            <button class="qnav-btn" id="qnav-yesterday">yesterday</button>
            <button class="qnav-btn qnav-all hidden" id="qnav-all">all notes</button>
          </div>
        </div>
        <div id="journal-posts">
          <div class="loading-card">loading your entries...</div>
        </div>
      </section>

      <!-- Friends section -->
      <section id="friends-section" class="posts-section">
        <p class="section-tagline">find & follow people</p>
        <div class="friend-search-wrap">
          <input type="text" id="friend-search-input" placeholder="search by @username..." autocomplete="off" />
          <button id="friend-search-btn" class="friend-search-btn">SEARCH</button>
        </div>
        <div id="friends-content"></div>
      </section>

    </main>

    <!-- ── Bottom navigation (GoodNotes-style) ── -->
    <nav class="bottom-nav">
      <button class="bottom-tab active" data-tab="feed">
        <span class="btab-icon">🌍</span>
        <span class="btab-label">FEED</span>
      </button>
      <button class="bottom-tab compose-trigger" id="compose-trigger">
        <span class="btab-icon">✏️</span>
        <span class="btab-label">NEW PAGE</span>
      </button>
      <button class="bottom-tab" data-tab="friends">
        <span class="btab-icon">🔍</span>
        <span class="btab-label">FRIENDS</span>
      </button>
      <button class="bottom-tab" data-tab="journal">
        <span class="btab-icon">🔒</span>
        <span class="btab-label">JOURNAL</span>
      </button>
    </nav>

    <!-- ── Composer Modal ── -->
    <div id="composer-overlay" class="composer-overlay hidden" role="dialog" aria-modal="true">
      <div class="composer-modal">

        <div class="composer-modal-header">
          <span class="composer-modal-title" id="composer-title">new page</span>
          <button id="composer-close" class="composer-close-btn">✕</button>
        </div>

        <textarea
          id="post-content"
          class="post-textarea"
          placeholder="Today I felt..."
          maxlength="1000"
        ></textarea>

        <div class="composer-controls">

          <!-- Image upload -->
          <label class="image-upload-label" for="post-image">
            <span>📎</span> attach photo
            <input type="file" id="post-image" accept="image/*" hidden />
          </label>

          <!-- Image preview -->
          <div id="image-preview-wrap" class="image-preview-wrap hidden">
            <img id="image-preview" src="" alt="preview" />
            <button id="remove-image" class="remove-img-btn">✕</button>
          </div>

          <!-- Privacy toggle -->
          <div class="privacy-row">
            <label class="toggle-label">
              <input type="checkbox" id="is-private-toggle" />
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
              <span id="privacy-label-text">public 🌍</span>
            </label>
          </div>

        </div>

        <p id="post-error" class="form-error"></p>

        <button id="submit-post" class="btn-pill btn-pill-submit">PIN IT ✦</button>

      </div>
    </div>

    <!-- ── Calendar popup ── -->
    <div id="calendar-popup" class="calendar-popup hidden"></div>

  </div><!-- /app -->

  <!-- ═══════════════════════════════════════════
       POST CARD TEMPLATE
  ═══════════════════════════════════════════ -->
  <template id="post-card-template">
    <article class="post-card">
      <div class="card-dot-sticker"></div>
      <p class="post-content-text"></p>
      <div class="post-image-wrap hidden">
        <img class="post-image" src="" alt="" />
      </div>
      <footer class="card-footer">
        <span class="post-username"></span>
        <span class="post-date"></span>
      </footer>
      <div class="card-actions"></div>
    </article>
  </template>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
